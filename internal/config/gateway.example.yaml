# Every setting the gateway understands, with its default.
# Copy this file, keep what you need, and start with:  gateway -config your-file.yaml
#
# ${NAME} is replaced by the environment variable NAME.
# ${NAME:-default} uses default when NAME is unset or empty.
# Unknown keys are errors, so typos are caught at startup.

server:
  addr: ":8080"               # where to listen
  read_header_timeout: 5s     # protects against clients that send headers very slowly
  read_timeout: 30s           # time allowed to read a whole request
  idle_timeout: 120s          # close unused keep-alive connections after this
  shutdown_timeout: 30s       # time in-flight requests get to finish on shutdown
  drain_delay: 0s             # time /readyz says "not ready" before shutdown; use ~5s behind a load balancer
  max_body_bytes: 1048576     # largest request body accepted (1 MiB)

log:
  level: info                 # debug, info, warn or error
  format: text                # text or json

providers:                    # at least one; names are yours to choose
  ray:
    base_url: http://localhost:8000   # required; the gateway calls <base_url>/v1/chat/completions
    connect_timeout: 2s               # time to open a connection
    request_timeout: 60s              # time for the whole answer
  openai:
    base_url: https://api.openai.com
    api_key: ${OPENAI_API_KEY}        # secrets only ever come from the environment
    request_timeout: 60s

models:                       # at least one alias; each lists targets to try in order
  fast:
    - provider: ray
      model: llama
  smart:
    - provider: openai
      model: gpt-4o-mini
