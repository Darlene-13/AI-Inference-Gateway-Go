# golangci-lint runs many Go linters at once. Run it with: make lint
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    exhaustive:

      default-signifies-exhaustive: false
  exclusions:
    presets:
      - comments
    rules:
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
